<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>单词记忆</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0066cc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon_192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
:root { --pico-font-size: 100%; }
body { padding: 1rem; background: #f5f7fb; }
.container { max-width: 480px; margin: 0 auto; }
.header { display: flex; flex-direction: column; margin-bottom: 1rem; }
.header h1 { font-size: 1.4rem; margin: 0; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
.stat-card { background: white; border-radius: 12px; padding: 0.8rem; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.stat-card .num { font-size: 1.5rem; font-weight: 700; color: #0066cc; }
.stat-card .label { font-size: 0.75rem; color: #666; margin-top: 0.2rem; }
.card-wrap { perspective: 800px; margin-bottom: 1rem; min-height: 280px; }
.card { background: white; border-radius: 16px; padding: 2rem 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; min-height: 280px; display: flex; flex-direction: column; justify-content: center; }
.card .word { font-size: 2rem; font-weight: 700; }
.card .phonetic { font-size: 1rem; color: #888; margin-top: 0.3rem; }
.card .meaning { font-size: 1.3rem; margin-top: 0.8rem; }
.card .example { font-size: 0.85rem; color: #666; margin-top: 0.8rem; font-style: italic; }
.card .example-cn { font-size: 0.85rem; color: #999; margin-top: 0.2rem; }
.card .tap-hint { font-size: 0.8rem; color: #aaa; margin-top: 1rem; }
.action-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.action-row button { flex: 1; font-size: 0.9rem; }
.btn-forgot { --pico-background-color: #e74c3c; --pico-border-color: #e74c3c; }
.btn-blur { --pico-background-color: #f39c12; --pico-border-color: #f39c12; }
.btn-got { --pico-background-color: #27ae60; --pico-border-color: #27ae60; }
button.soft { background: #0066cc; border-color: #0066cc; border-radius: 24px; padding: 0.6rem 1.2rem; }
.progress-text { text-align: center; font-size: 0.8rem; color: #888; }
progress { margin-bottom: 0.5rem; }
.empty { text-align: center; padding: 3rem 0; color: #999; }
.page { display: none; }
.page.active { display: block; }
.word-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
.word-item .en { font-weight: 600; }
.word-item .zh { color: #666; font-size: 0.85rem; }
.word-item .stage { font-size: 0.75rem; color: #999; }
.nav-bar { display: flex; gap: 0.5rem; margin-top: 1rem; }
.nav-bar button { flex: 1; font-size: 0.85rem; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #eee; padding: 0.3rem 0; z-index: 100; justify-content: center; }
.bottom-nav .bnav { flex: 1; max-width: 96px; border: none; background: none; color: #888; font-size: 0.75rem; padding: 0.4rem 0; cursor: pointer; text-align: center; }
.bottom-nav .bnav.active { color: #0066cc; font-weight: 600; }
body { padding-bottom: 3.5rem; }
.login-box { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.loading-spinner { display:none; text-align:center; padding:4rem 0; color:#999; min-height:200px; align-items:center; justify-content:center; }
.loading-spinner.active { display:flex; }
.loading-spinner .dot { display:inline-block; width:10px; height:10px; margin:0 4px; border-radius:50%; background:#0066cc; animation:bounce 1.4s ease-in-out infinite both; }
.loading-spinner .dot:nth-child(1) { animation-delay:-0.32s; }
.loading-spinner .dot:nth-child(2) { animation-delay:-0.16s; }
.loading-spinner .dot:nth-child(3) { animation-delay:0s; }
@keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
.review-badge { display:inline-block; background:#f39c12; color:white; font-size:0.7rem; padding:0.15rem 0.6rem; border-radius:10px; margin-bottom:0.5rem; }
.src-badge { display:inline-block; font-size:0.65rem; padding:0.1rem 0.5rem; border-radius:8px; margin-left:0.3rem; vertical-align:middle; }
.src-badge.cet4 { background:#e8f4fd; color:#0066cc; }
.src-badge.primary { background:#fef3e2; color:#e67e22; }
.src-badge.import { background:#f0f0f0; color:#666; }
/* 全局弹窗按钮（统一尺寸/圆角/字号，确定和取消视觉一致） */
.modal-btn { display:inline-block; min-width:80px; border:none; border-radius:24px; padding:0.6rem 1.5rem; font-size:0.9rem; cursor:pointer; font-family:inherit; transition:opacity 0.15s; }
.modal-btn:active { opacity:0.7; }
.modal-btn-primary { background:#0066cc; color:white; box-shadow:0 2px 8px rgba(0,102,204,0.3); }
.modal-btn-secondary { background:#f0f0f0; color:#333; border:1px solid #ddd; }
#modalBtns { display:flex; gap:0.6rem; justify-content:center; }
</style>
</head>
<body>
<div class="container">
<div id="loginPage" style="padding:3rem 0;">
    <h2 style="text-align:center;margin-bottom:2rem;">📚 单词记忆</h2>
    <div class="login-box">
        <input type="text" id="loginPhone" placeholder="手机号" style="margin-bottom:0.8rem;">
        <input type="password" id="loginPw" placeholder="密码" style="margin-bottom:1rem;">
        <p id="loginMsg" style="color:red;font-size:0.85rem;min-height:1.2rem;"></p>
        <button onclick="login()" style="margin-bottom:0.5rem;">登录</button>
        <button onclick="register()" class="outline">注册</button>
    </div>
</div>

<div id="mainApp" style="display:none;">
<div class="header">
    <h1>📚 单词记忆 <span id="userPhone" style="font-size:0.7rem;color:#888;"></span></h1>
    <!-- 第一行：每日设置 -->
    <div style="display:flex;gap:0.3rem;align-items:center;">
        <span style="font-size:0.75rem;color:#888;white-space:nowrap;width:2rem;">每日</span>
        <input type="number" id="dailyLimit" value="100" min="10" max="999" style="width:50px;padding:0.2rem;text-align:center;margin-bottom:0;height:44px;">
        <select id="modeSelect" style="flex:1;min-width:60px;margin-bottom:0;font-size:0.8rem;height:44px;">
            <option value="mix">混合</option>
            <option value="new">新词</option>
            <option value="review">复习</option>
        </select>
        <button onclick="logout()" class="outline" style="padding:0.2rem 0.5rem;font-size:0.7rem;height:42px;">退出</button>
    </div>
    <!-- 第二行：词库筛选（与上方控件左右对齐） -->
    <div style="display:flex;gap:0.3rem;align-items:center;margin-top:0.3rem;">
        <span style="font-size:0.75rem;color:#888;white-space:nowrap;width:2rem;">词库</span>
        <select id="sourceFilter" style="flex:1;margin-bottom:0;font-size:0.8rem;height:44px;" onchange="onSourceChange()">
            <option value="">全部</option>
        </select>
    </div>
</div>
<div class="stats-grid">
    <div class="stat-card"><div class="num" id="statReview">0</div><div class="label">待复习</div></div>
    <div class="stat-card"><div class="num" id="statNew">0</div><div class="label">今日可学</div></div>
    <div class="stat-card"><div class="num" id="statMastered">0</div><div class="label">已掌握</div></div>
</div>

<div class="page active" id="pageHome"><div class="loading-spinner" id="loadingSpinner"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div id="homeContent"></div>
</div>
<div class="page" id="pageWords"><div id="wordList"></div></div>
<div class="page" id="pageStats"><div id="statsContent"></div></div>
<div class="page" id="pageCurve"><h3>遗忘曲线设置</h3><p style="font-size:0.85rem;color:#666;">通过后升阶，模糊则降阶减半，遗忘归零。可自定义各阶段间隔。</p><div id="curveSettings"></div><button onclick="saveCurve();return false;">保存设置</button><button onclick="resetCurve()" class="outline" style="margin-left:0.5rem;">恢复默认</button><p style="margin-top:0.8rem;text-align:center;"><a href="javascript:showPage('pageRules')" style="font-size:0.8rem;color:#0066cc;">📖 遗忘曲线规则详解</a></p></div>
<div class="page" id="pageRules"><h3>📖 遗忘曲线规则</h3><div id="rulesContent"></div></div>
<div class="page" id="pageImport"><h3>导入词库</h3><p style="font-size:0.85rem;color:#666;">每行一个单词，格式：英文，中文释义（音标、例句可选），清空后粘贴你自己的词库</p><div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:0.5rem;"><span style="font-size:0.85rem;color:#888;">词库标签</span><select id="importSource" style="display:inline;width:auto;margin-bottom:0;font-size:0.85rem;"><option value="import">自定义</option><option value="cet4">CET-4</option><option value="grade_g3a">三年级上册</option><option value="grade_g3b">三年级下册</option><option value="grade_g4a">四年级上册</option><option value="grade_g4b">四年级下册</option><option value="grade_g5a">五年级上册</option><option value="grade_g5b">五年级下册</option><option value="grade_g6a">六年级上册</option><option value="grade_g6b">六年级下册</option></select></div><textarea id="importText" rows="6" placeholder="apple, 苹果, /ˈæp.əl/&#10;book, 书本, /bʊk/&#10;cat, 猫, /kæt/, The cat is sleeping., 猫在睡觉。"></textarea><button onclick="importWords()">导入</button><hr><button onclick="loadCET4()" class="outline">📚 CET-4 完整词库</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;margin-top:0.5rem;"><button onclick="loadGrade('g3a','三年级上册')" class="outline">📗 三年级上册</button><button onclick="loadGrade('g3b','三年级下册')" class="outline">📗 三年级下册</button><button onclick="loadGrade('g4a','四年级上册')" class="outline">📘 四年级上册</button><button onclick="loadGrade('g4b','四年级下册')" class="outline">📘 四年级下册</button><button onclick="loadGrade('g5a','五年级上册')" class="outline">📙 五年级上册</button><button onclick="loadGrade('g5b','五年级下册')" class="outline">📙 五年级下册</button><button onclick="loadGrade('g6a','六年级上册')" class="outline">📕 六年级上册</button><button onclick="loadGrade('g6b','六年级下册')" class="outline">📕 六年级下册</button></div><button onclick="exportWords()" class="outline" style="margin-top:0.5rem;">📤 导出备份</button></div>
<div class="page" id="pageRank"><h3>🏆 排行榜</h3><div id="rankContent"></div></div>
<div class="page" id="pageAdmin"><h3>👑 管理面板</h3><div id="adminContent"></div></div>
<!-- 底部导航（全局固定，不在任何.page内部） -->
<div class="bottom-nav">
    <button onclick="showPage('pageHome')" class="bnav" id="bnavHome">首页</button>
    <button onclick="showPage('pageWords')" class="bnav" id="bnavWords">词库</button>
    <button onclick="showPage('pageStats')" class="bnav" id="bnavStats">统计</button>
    <button onclick="showPage('pageRank')" class="bnav" id="bnavRank">排行</button>
    <button onclick="showPage('pageCurve')" class="bnav" id="bnavCurve">曲线</button>
    <button onclick="showPage('pageRules')" class="bnav" id="bnavRules">规则</button>
    <button onclick="showPage('pageImport')" class="bnav" id="bnavImport">导入</button>
    <button onclick="showPage('pageAdmin')" class="bnav" id="bnavAdmin" style="display:none;">管理</button>
</div>
</div>
</div>

<script>
const API = '/api';

// ============ 网络层 ============
function headers() {
    return {'Content-Type':'application/json', 'X-Phone': localStorage.getItem('phone')||''};
}

async function api(method, path, body) {
    const r = await fetch(API+path, {method, headers:headers(), body:body?JSON.stringify(body):null});
    return r.json();
}

// ============ 登录 ============
async function register() {
    const phone = document.getElementById('loginPhone').value.trim();
    const pw = document.getElementById('loginPw').value.trim();
    if (!phone || !pw) return document.getElementById('loginMsg').textContent = '请填写手机号和密码';
    if (!/^\d{11}$/.test(phone)) return document.getElementById('loginMsg').textContent = '手机号需11位数字';
    if (pw.length < 8) return document.getElementById('loginMsg').textContent = '密码至少8位';
    if (!/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw)) return document.getElementById('loginMsg').textContent = '密码需包含字母和数字';
    const r = await api('POST', '/register', {phone, password: pw});
    document.getElementById('loginMsg').textContent = r.msg || '';
    if (r.ok) { localStorage.setItem('phone', phone); localStorage.setItem('is_admin', r.is_admin?'1':'0'); location.reload(); }
}

async function login() {
    const phone = document.getElementById('loginPhone').value.trim();
    const pw = document.getElementById('loginPw').value.trim();
    if (!phone || !pw) return document.getElementById('loginMsg').textContent = '请填写手机号和密码';
    const r = await api('POST', '/login', {phone, password: pw});
    document.getElementById('loginMsg').textContent = r.msg || '';
    if (r.ok) { localStorage.setItem('phone', phone); localStorage.setItem('is_admin', r.is_admin?'1':'0'); location.reload(); }
}

function logout() {
    localStorage.removeItem('phone');
    location.reload();
}

// ============ 数据层 ============
async function getAllWords() {
    try { const r = await api('GET', '/words'); return r.words || []; } catch(e) { return []; }
}
async function saveWord(w) {
    await api('PUT', '/words', w);
}
async function saveWords(list) {
    await api('POST', '/words', list);
}
async function deleteWord(word) {
    await api('DELETE', '/words/'+encodeURIComponent(word));
}

// ============ 遗忘曲线 ============
// 从本地加载自定义间隔
let customInt = JSON.parse(localStorage.getItem('curve_intervals') || 'null');
const STAGES = [
    {stage:0, label:'T0', interval:0},
    {stage:1, label:'T1', interval:1/24},
    {stage:2, label:'T2', interval:1},
    {stage:3, label:'T3', interval:3},
    {stage:4, label:'T4', interval:7},
    {stage:5, label:'T5', interval:customInt?customInt[4]:30},
];
if (customInt) {
    STAGES[1].interval = customInt[0]/24;
    STAGES[2].interval = customInt[1];
    STAGES[3].interval = customInt[2];
    STAGES[4].interval = customInt[3];
    STAGES[5].interval = customInt[4];
}

function calcNextTime(stage, result) {
    if (result === 'forgot') return {stage:0, nextTime: Date.now()+30000};
    if (result === 'blur') {
        let s = Math.max(0, stage-1);
        return {stage:s, nextTime: Date.now()+STAGES[s].interval*0.5*86400000};
    }
    let next = stage+1;
    if (next >= 6) return {stage:5, nextTime:null, mastered:true};
    return {stage:next, nextTime: Date.now()+STAGES[next].interval*86400000};
}

// ============ 状态 ============
let state = {mode:'mix', dailyLimit:100, words:[], todayDate:'', todayStudied:0, todayReviewed:0, _wordsLoaded:false, currentSource:'', reviewDeduct:false, _forceNextFetch:false};

function loadState() {
    try {
        const s = JSON.parse(localStorage.getItem('recite_state'));
        if (s) { state.todayDate=s.todayDate||''; state.todayStudied=s.todayStudied||0;
            state.todayReviewed=s.todayReviewed||0; state.dailyLimit=s.dailyLimit||100; state.mode=s.mode||'mix';
            state.reviewDeduct = s.reviewDeduct || false; }
    } catch(e) {}
}

function saveState() {
    localStorage.setItem('recite_state', JSON.stringify({
        todayDate:state.todayDate, todayStudied:state.todayStudied,
        todayReviewed:state.todayReviewed, dailyLimit:state.dailyLimit, mode:state.mode,
        reviewDeduct:state.reviewDeduct
    }));
}

// 按来源过滤单词
function getFilteredWords() {
    if (!state.currentSource) return state.words;
    return state.words.filter(w => w.source === state.currentSource);
}

// 词库源 → 显示名映射
var SOURCE_LABELS = {
    'cet4': 'CET-4', 'import': '自定义',
    'grade_g3a': '三年级上册', 'grade_g3b': '三年级下册',
    'grade_g4a': '四年级上册', 'grade_g4b': '四年级下册',
    'grade_g5a': '五年级上册', 'grade_g5b': '五年级下册',
    'grade_g6a': '六年级上册', 'grade_g6b': '六年级下册',
};

// 根据 state.words 动态更新词库筛选器（只显示用户已导入的词库）
function updateSourceFilter() {
    var sel = document.getElementById('sourceFilter');
    var currentVal = sel.value;
    // 收集用户已有的词库
    var sources = {};
    var noSource = 0;
    for (var i=0;i<state.words.length;i++) {
        var src = state.words[i].source;
        if (src) { sources[src] = (sources[src]||0) + 1; }
        else { noSource++; }
    }
    if (noSource > 0) { sources[''] = noSource; }
    // 重建选项（保留「全部」）
    sel.innerHTML = '<option value="">全部</option>';
    var keys = Object.keys(sources).sort();
    for (var j=0;j<keys.length;j++) {
        var k = keys[j];
        var label = SOURCE_LABELS[k] || k;
        var opt = document.createElement('option');
        opt.value = k;
        opt.textContent = label + '（' + sources[k] + '词）';
        sel.appendChild(opt);
    }
    // 恢复选中值
    if (currentVal && sources[currentVal]) sel.value = currentVal;
    else sel.value = '';
    state.currentSource = sel.value;
}

function onSourceChange() {
    state.currentSource = document.getElementById('sourceFilter').value;
    localStorage.setItem('recite_source', state.currentSource);
    // 刷新当前页面
    var active = document.querySelector('.page.active');
    if (active) showPage(active.id);
}

function checkDate() {
    const today = new Date().toDateString();
    if (today !== state.todayDate) {
        state.todayDate = today; state.todayStudied = 0; state.todayReviewed = 0; saveState();
    }
}

async function loadWords(force) {
    var reallyForce;
    var skipFlag = sessionStorage.getItem('_skipCache');
    console.log('[DBG] loadWords force=' + force + ' skipFlag=' + skipFlag + ' _loaded=' + state._wordsLoaded + ' words.len=' + state.words.length);
    if (skipFlag) {
        console.log('[DBG] loadWords: skipCache=true, forcing network fetch');
        sessionStorage.removeItem('_skipCache');
        reallyForce = true;
    } else {
        reallyForce = force || state._forceNextFetch;
    }
    state._forceNextFetch = false;
    if (!reallyForce && state._wordsLoaded) { console.log('[DBG] loadWords: early return'); return; }
    // 网络加载（正常路径）；失败/空时用缓存兜底，避免空白
    var fresh = await getAllWords();
    console.log('[DBG] loadWords: got ' + (fresh ? fresh.length : 0) + ' words from server');
    if (fresh && fresh.length > 0 || !state._wordsLoaded) {
        if (fresh && fresh.length > 0) {
            state.words = fresh;
            try { localStorage.setItem('recite_words_cache', JSON.stringify({words:fresh, time:Date.now()})); } catch(e){}
        } else {
            // 网络失败/无数据：用缓存兜底
            try {
                var cached = JSON.parse(localStorage.getItem('recite_words_cache'));
                if (cached && cached.words && Array.isArray(cached.words)) state.words = cached.words;
            } catch(e){}
        }
        state._wordsLoaded = true;
        updateSourceFilter();
    }
    console.log('[DBG] loadWords: done, state.words=' + state.words.length);
}

async function refreshStats() {
    console.log('[DBG] refreshStats start _forceNextFetch=' + state._forceNextFetch + ' _loaded=' + state._wordsLoaded);
    // 强制拉新或首次加载时显示 loading 转圈
    var shouldShowLoading = state._forceNextFetch || !state._wordsLoaded;
    console.log('[DBG] shouldShowLoading=' + shouldShowLoading);
    if (shouldShowLoading) {
        document.getElementById('loadingSpinner').classList.add('active');
    } else {
        var hasCache = false;
        try { var c = JSON.parse(localStorage.getItem('recite_words_cache')); hasCache = !!(c && c.words && c.words.length); } catch(e){}
        if (!hasCache) document.getElementById('loadingSpinner').classList.add('active');
    }
    checkDate(); await loadWords();
    console.log('[DBG] after loadWords state.words.length=' + state.words.length + ' currentSource=' + state.currentSource);
    var words = getFilteredWords();
    console.log('[DBG] getFilteredWords()=' + words.length);
    console.log('[DBG] refreshStats source='+state.currentSource+' total='+state.words.length+' filtered='+words.length);
    const now = Date.now();
    let review = words.filter(w => w.status==='learning' && w.next_time && w.next_time <= now);
    let newW = words.filter(w => w.status==='new' || !w.status);
    let mastered = words.filter(w => w.status==='mastered');
    console.log('[DBG] review=' + review.length + ' new=' + newW.length + ' mastered=' + mastered.length);
    var consumed = state.todayStudied + (state.reviewDeduct ? state.todayReviewed : 0);
    let remaining = Math.max(0, state.dailyLimit - consumed);
    console.log('[DBG] dailyLimit=' + state.dailyLimit + ' consumed=' + consumed + ' remaining=' + remaining);
    document.getElementById('statReview').textContent = review.length;
    document.getElementById('statNew').textContent = (newW.length > 0 ? remaining + '/' + newW.length : '0');
    document.getElementById('statMastered').textContent = mastered.length;
    document.getElementById('dailyLimit').value = state.dailyLimit;
    renderHome(review, newW);
    document.getElementById('loadingSpinner').classList.remove('active');
    console.log('[DBG] statNew display=' + document.getElementById('statNew').textContent);
}

function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

    if (id==='pageStats') { renderStatsPage(); }

// 更新统计数字（不刷新页面）
function updateStats() {
    var now = Date.now();
    var words = getFilteredWords();
    var review = words.filter(function(w) { return w.status==='learning' && w.next_time && w.next_time <= now; }).length;
    var newW = words.filter(function(w) { return w.status==='new' || !w.status; }).length;
    var mastered = words.filter(function(w) { return w.status==='mastered'; }).length;
    document.getElementById('statReview').textContent = review;
    var consumed = state.todayStudied + (state.reviewDeduct ? state.todayReviewed : 0);
    var rem = Math.max(0, state.dailyLimit - consumed);
    document.getElementById('statNew').textContent = (newW > 0 ? rem + '/' + newW : '0');
    document.getElementById('statMastered').textContent = mastered;
}

// ============ 首页 ============
let currentWords=[], currentIndex=0, isReview=false;

function renderHome(review, newW) {
    const mode = state.mode;
    // reviewDeduct=true 时复习也占用每日名额
    var consumed = state.todayStudied + (state.reviewDeduct ? state.todayReviewed : 0);
    var remaining = Math.max(0, state.dailyLimit - consumed);
    let list=[], rv=false;
    if (mode==='review') { list=review; rv=true; }
    else if (mode==='new') { list=newW.slice(0,Math.max(0,remaining)); rv=false; }
    else { if (review.length>0) { list=review; rv=true; } else { list=newW.slice(0,Math.max(0,remaining)); rv=false; } }
    if (list.length===0) {
        if (state.words.length === 0) {
            document.getElementById('homeContent').innerHTML = '<div class="empty"><p>📭 暂无单词</p><p style="font-size:0.8rem;">请先导入词库</p></div>';
        } else {
            document.getElementById('homeContent').innerHTML = '<div class="empty"><p>✅ 今日已完成</p><p style="font-size:0.8rem;">学' + state.todayStudied + ' 复习' + state.todayReviewed + '</p></div>';
        }
        return;
    }
    currentWords=list; currentIndex=0; isReview=rv;
    showCard();
}

function showCard() {
    if (currentIndex>=currentWords.length) {
        return refreshStats();
    }
    const w = currentWords[currentIndex];
    const total = currentWords.length;
    if (isReview) {
        document.getElementById('homeContent').innerHTML = `
        <div class="card-wrap">
            <div class="card" onclick="flipReview()" id="reviewCard">
                <div class="review-badge">📖 复习</div>
                <div class="word">${w.word}</div>
                ${w.phonetic ? `<div class="phonetic">${w.phonetic}</div>` : ''}
                <div class="tap-hint">点击翻转看答案</div>
            </div>
        </div>
        <div class="action-row" id="reviewBtns" style="display:none;">
            <button class="btn-forgot" onclick="rateWord('forgot')">❌ 忘记</button>
            <button class="btn-blur" onclick="rateWord('blur')">🔄 模糊</button>
            <button class="btn-got" onclick="rateWord('got')">✅ 记住</button>
        </div>
        <progress value="${currentIndex+1}" max="${total}"></progress>
        <div class="progress-text">${currentIndex+1}/${total}</div>`;
    } else {
        document.getElementById('homeContent').innerHTML = `
        <div class="card-wrap"><div class="card">
            <div class="word">${w.word}</div>
            ${w.phonetic ? `<div class="phonetic">${w.phonetic}</div>` : ''}
            <div class="meaning">${w.meaning||''}</div>
            ${w.example ? `<div class="example">${w.example}</div>` : ''}
            ${w.example_cn ? `<div class="example-cn">${w.example_cn}</div>` : ''}
        </div></div>
        <button onclick="nextCard()" class="soft">下一张 ${currentIndex+1}/${total}</button>
        <progress value="${currentIndex+1}" max="${total}"></progress>
        <div class="progress-text">${currentIndex+1}/${total}</div>`;
    }
}

let flipped=false;
function flipReview() {
    if (flipped) return;
    flipped=true;
    const w = currentWords[currentIndex];
    document.getElementById('reviewCard').innerHTML = `
        <div class="word">${w.word}</div>
        <div class="meaning">${w.meaning||''}</div>
        ${w.phonetic ? `<div class="phonetic">${w.phonetic}</div>` : ''}
        ${w.example ? `<div class="example">${w.example}</div>` : ''}
        ${w.example_cn ? `<div class="example-cn">${w.example_cn}</div>` : ''}`;
    document.getElementById('reviewBtns').style.display = 'flex';
}

async function nextCard() {
    if (isReview) return;
    const w = currentWords[currentIndex];
    w.status='learning'; w.stage=0; w.next_time=Date.now()+3600000; w.last_time=Date.now(); w.fail_count=w.fail_count||0;
    await saveWord(w);
    state.todayStudied++; saveState();
    updateStats();
    currentIndex++; showCard();
}

async function rateWord(result) {
    const w = currentWords[currentIndex];
    w.last_time=Date.now();
    if (result==='forgot') { w.fail_count=(w.fail_count||0)+1; const r=calcNextTime(w.stage||0,'forgot'); w.stage=r.stage; w.next_time=r.nextTime; }
    else if (result==='blur') { const r=calcNextTime(w.stage||0,'blur'); w.stage=r.stage; w.next_time=r.nextTime; }
    else { const r=calcNextTime(w.stage||0,'got'); w.stage=r.stage; w.next_time=r.nextTime; if(r.mastered) w.status='mastered'; }
    await saveWord(w);
    state.todayReviewed++; saveState();
    updateStats();
    flipped=false;
    currentIndex++;
    if (isReview && currentIndex >= currentWords.length) {
        // 复习完成：先刷新数据判断有无新词
        await refreshStats();
        var hasNew = (currentWords.length > 0 && !isReview);
        if (hasNew) {
            showModal('🎉 复习完成！即将进入新词', function(){
                // 直接切到新词卡片
                showPage('pageHome');
            });
        } else {
            showModal('🎉 今日复习完成！');
        }
    } else if (currentIndex >= currentWords.length) {
        await refreshStats();
    } else {
        showCard();
    }
}

// ============ 词库 ============
async function renderWordList() {
    var listEl = document.getElementById('wordList');
    // 强制拉新或数据未加载时显示 loading
    if (state._forceNextFetch || !state._wordsLoaded) {
        listEl.innerHTML = '<div class="loading-spinner active"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    } else if (state._wordsLoaded && state.words.length > 0 && getFilteredWords().length === 0) {
        listEl.innerHTML = '<div class="empty">⏳ 数据加载中...</div>';
    }
    await loadWords();
    var words = getFilteredWords();
    if (words.length===0) {
        document.getElementById('wordList').innerHTML = '<div class="empty">暂无单词</div>';
        return;
    }
    // 分批渲染，前200条立即展示，剩下的懒加载
    var batchSize = 200;
    var html = words.slice(0, batchSize).map(w =>
        '<div class="word-item"><div><span class="en">'+w.word+'</span> <span class="zh">'+(w.meaning||'')+'</span></div>'+
        '<div><span class="stage">'+(STAGES[w.stage||0]?.label||'新词')+'</span>'+
        '<button class="outline" style="padding:0.2rem 0.5rem;margin-left:0.3rem;" onclick="delW(\''+w.word+'\')">×</button></div></div>'
    ).join('');
    document.getElementById('wordList').innerHTML = html;
    // 剩余单词分批追加
    if (words.length > batchSize) {
        var idx = batchSize;
        function appendBatch() {
            var end = Math.min(idx + batchSize, words.length);
            var more = words.slice(idx, end).map(w =>
                '<div class="word-item"><div><span class="en">'+w.word+'</span> <span class="zh">'+(w.meaning||'')+'</span></div>'+
                '<div><span class="stage">'+(STAGES[w.stage||0]?.label||'新词')+'</span>'+
                '<button class="outline" style="padding:0.2rem 0.5rem;margin-left:0.3rem;" onclick="delW(\''+w.word+'\')">×</button></div></div>'
            ).join('');
            document.getElementById('wordList').insertAdjacentHTML('beforeend', more);
            idx = end;
            if (idx < words.length) requestAnimationFrame(appendBatch);
        }
        requestAnimationFrame(appendBatch);
    }
}

async function delW(word) {
    showConfirm('确定删除「'+word+'」？', async function(){
        await deleteWord(word);
        renderWordList();
    });
}

// 带输入框的弹窗（复用统一弹窗样式）
function showPrompt(msg, onOk) {
    var modal = document.getElementById('myModal');
    var msgEl = document.getElementById('modalMsg');
    var btns = document.querySelectorAll('#modalBtns button');
    // 建输入框
    var input = document.createElement('input');
    input.type = 'password';
    input.placeholder = '输入新密码';
    input.style.cssText = 'width:100%;padding:0.6rem;border:1px solid #ddd;border-radius:10px;font-size:1rem;margin-bottom:1rem;box-sizing:border-box;text-align:center;';
    input.id = 'promptInput';
    // 替换内容
    msgEl.textContent = msg;
    msgEl.after(input);
    if (btns.length >= 2) { btns[0].style.display = 'inline-block'; btns[1].style.display = 'inline-block'; }
    btns[0].textContent = '确定';
    btns[1].textContent = '取消';
    modal.style.display = 'flex';
    modal.style.alignItems = 'center';
    modal.style.justifyContent = 'center';
    window._promptCallback = onOk;
    window._modalCallback = null;
    window._confirmCallback = null;
    modal.removeAttribute('data-cb');
    setTimeout(function(){ input.focus(); }, 100);
    // 回车确认
    input.onkeydown = function(e) {
        if (e.key === 'Enter') {
            document.getElementById('promptInput').remove();
            modal.style.display = 'none';
            restorePromptBtns();
            if (window._promptCallback) {
                var cb = window._promptCallback;
                window._promptCallback = null;
                setTimeout(function(){ cb(input.value); }, 50);
            }
        }
    };
    // 覆盖确认按钮
    // 保存原 handler 用于恢复
    var origOk = btns[0].onclick;
    var origCancel = btns[1].onclick;
    btns[0].onclick = function() {
        var inputEl = document.getElementById('promptInput');
        if (!inputEl) return;
        var val = inputEl.value;
        inputEl.remove();
        modal.style.display = 'none';
        restorePromptBtns();
        if (window._promptCallback) {
            var cb = window._promptCallback;
            window._promptCallback = null;
            setTimeout(function(){ cb(val); }, 50);
        }
    };
    btns[1].onclick = function() {
        var inputEl = document.getElementById('promptInput');
        if (inputEl) inputEl.remove();
        modal.style.display = 'none';
        restorePromptBtns();
        window._promptCallback = null;
    };
    function restorePromptBtns() {
        btns[0].onclick = origOk;
        btns[1].onclick = origCancel;
    }
    // 关闭弹窗时也恢复
    var origClose = modal.onclick;
    modal.onclick = function(e) {
        if (e.target === modal) {
            var inp = document.getElementById('promptInput');
            if (inp) inp.remove();
            restorePromptBtns();
            modal.style.display = 'none';
            window._promptCallback = null;
        }
    };
}

// 用简单的 CSV 行解析（处理带逗号的问题）
function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuote = false;
    for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuote = !inQuote; continue; }
        if (ch === ',' && !inQuote) { result.push(current); current = ''; continue; }
        current += ch;
    }
    result.push(current);
    return result;
}

// 遗忘曲线算法自测（快进时间，不等实际分钟）
window.__test.curve = async function() {
    var ok=0, fail=0, errs=[];
    function chk(desc, cond) { if(cond) { ok++; console.log('  ✅ '+desc); } else { fail++; console.log('  ❌ '+desc); errs.push(desc); } }
    console.log('===== 遗忘曲线自测 =====');
    var origInt = JSON.parse(localStorage.getItem('curve_intervals') || 'null') || [1, 1, 7, 30, 365];
    var ti = [0.017, 0.0014, 0.0021, 0.0028, 0.0035];
    localStorage.setItem('curve_intervals', JSON.stringify(ti));
    STAGES[1].interval = ti[0]/24; STAGES[2].interval = ti[1];
    STAGES[3].interval = ti[2]; STAGES[4].interval = ti[3]; STAGES[5].interval = ti[4];
    var w = state.words.find(function(x){ return x.status==='new'||!x.status; });
    if (!w) { console.log('  无新词，跳过'); localStorage.setItem('curve_intervals',JSON.stringify(origInt)); return; }
    w.status='learning'; w.stage=0; w.next_time=Date.now()+STAGES[1].interval*86400000; w.last_time=Date.now(); w.fail_count=0;
    await saveWord(w); chk('T0→learning', w.status==='learning'&&w.stage===0);
    for (var s=1;s<=6;s++) {
        w.next_time=Date.now()-1000; await saveWord(w);
        var r=calcNextTime(s-1,'got'); w.stage=r.stage; w.next_time=r.nextTime;
        if(r.mastered) w.status='mastered'; w.last_time=Date.now(); await saveWord(w);
        if(s<6) chk('T'+(s-1)+'→T'+s, w.stage===s); else chk('T5→mastered', w.status==='mastered');
    }
    var br=calcNextTime(3,'blur'); chk('模糊→T2', br.stage===2);
    var fr=calcNextTime(3,'forgot'); chk('遗忘→T0', fr.stage===0); chk('遗忘→30s内到期', fr.nextTime<=Date.now()+30000);
    localStorage.setItem('curve_intervals', JSON.stringify(origInt));
    STAGES[1].interval=origInt[0]/24; STAGES[2].interval=origInt[1]; STAGES[3].interval=origInt[2]; STAGES[4].interval=origInt[3]; STAGES[5].interval=origInt[4];
    console.log('通过: '+ok+' | 失败: '+fail);
    if(!fail) console.log('🎉 通过！'); else console.log('失败:',errs);
};

            __pageTimings[id] = (performance.now() - t0).toFixed(0);
        });
    });
}

window.__test.run = async function() {
    var ok=0, fail=0, errs=[], _origOnError=window.onerror;
    // 全局 JS 异常捕获
    var caughtErrors=[];
    window.onerror=function(msg,url,line){ caughtErrors.push(msg+'(行'+line+')'); return true; };
    function check(desc, cond) { if(cond) { ok++; console.log('  ✅ '+desc); } else { fail++; console.log('  ❌ '+desc); errs.push(desc); } }
    function sleep(ms) { return new Promise(function(r){setTimeout(r,ms);}); }
    // 临时切到"全部"词库，避免筛选影响测试
    var _savedSrc = state.currentSource;
    state.currentSource = '';
    if (document.getElementById('sourceFilter')) document.getElementById('sourceFilter').value = '';

    console.log('%c===== 单词记忆 App 自测开始 =====','font-size:1.2rem;font-weight:bold');
    var start = Date.now();

    // 1. 底部导航 ×20 轮切换
    console.log('\n【1/4 底部导航稳定性（20轮）】');
    var pages = ['pageHome','pageWords','pageStats','pageCurve','pageImport'];
    for (var r=0; r<20; r++) {
        for (var i=0; i<pages.length; i++) {
            showPage(pages[i]);
            await sleep(80);
            check('导航按钮≥5个存在('+pages[i]+')', document.querySelectorAll('.bnav').length>=5);
            check('当前激活页面对应高亮('+pages[i]+')', document.getElementById('bnav'+pages[i].substring(4)).classList.contains('active'));
        }
    }
    check('导航切换20轮无JS异常', caughtErrors.length===0);
    check('首页内容正常渲染', document.getElementById('homeContent').innerHTML.length>0);

    // 2. 每日词量即时刷新 + 边界值
    console.log('\n【2/4 每日词量即时刷新+边界值】');
    var dl = document.getElementById('dailyLimit');
    var statNew = document.getElementById('statNew');
    // 边界值
    var bounds = [0, -10, 9999, 50, 100];
    for (var b=0; b<bounds.length; b++) {
        dl.value=String(bounds[b]);
        dl.dispatchEvent(new Event('input', {bubbles:true}));
        await sleep(80);
        var v = parseInt(statNew.textContent);
        check('每日='+bounds[b]+' → 今日可学是数字非NaN', !isNaN(v) && statNew.textContent!=='NaN');
        check('每日='+bounds[b]+' → 今日可学≥0', v >= 0);
    }
    dl.value='100'; dl.dispatchEvent(new Event('input', {bubbles:true}));
    await sleep(80);
    var baseNew = parseInt(statNew.textContent);
    dl.dispatchEvent(new Event('change', {bubbles:true}));
    check('边界值测试无JS异常', caughtErrors.length===0);

    // 3. 翻页+标记状态统计联动
    console.log('\n【3/4 翻页+标记状态统计联动】');
    showPage('pageHome'); await sleep(300);
    var beforeNew = parseInt(document.getElementById('statNew').textContent);
    var beforeReview = parseInt(document.getElementById('statReview').textContent);
    var beforeMastered = parseInt(document.getElementById('statMastered').textContent);
    // 翻新词卡片（等卡片内容更新了再点下一张）
    var flipped = 0;
    for (var i=0; i<3; i++) {
        var btn = document.querySelector('#homeContent button.soft');
        if (!btn || btn.textContent.indexOf('下一张')===-1) break;
        var oldText = document.querySelector('.card .word') ? document.querySelector('.card .word').textContent : '';
        btn.click();
        // 等卡片切换（最多等3秒）
        for (var w=0; w<30; w++) {
            await sleep(100);
            var newText = document.querySelector('.card .word') ? document.querySelector('.card .word').textContent : '';
            if (newText && newText !== oldText) break;
        }
        flipped++;
    }
    if (flipped>0) {
        await sleep(200);
        var afterNew = parseInt(document.getElementById('statNew').textContent);
        check('翻'+flipped+'张后今日可学减少'+flipped, beforeNew - afterNew === flipped);
    } else {
        console.log('  ⚠️ 无新词，跳');
    }
    // 构造一个复习词来测标记
    showPage('pageWords'); await sleep(300);
    // 找一个新词改成学习状态且到期
    var testWord = null;
    for (var i=0; i<state.words.length; i++) {
        if (state.words[i].status==='new' || !state.words[i].status) {
            testWord = state.words[i]; break;
        }
    }
    if (testWord) {
        testWord.status='learning'; testWord.stage=1; testWord.next_time=Date.now()-1000; testWord.last_time=Date.now();
        await saveWord(testWord);
        showPage('pageHome'); await sleep(300);
        // 首页应进入复习模式
        var reviewBtn = document.querySelector('#reviewBtns');
        if (reviewBtn) {
            console.log('  复习模式已进入，测试标记...');
            // 翻转卡片再点"记住"
            document.getElementById('reviewCard') && document.getElementById('reviewCard').click();
            await sleep(100);
            var gotBtn = document.querySelector('.btn-got');
            if (gotBtn) {
                var mBefore = parseInt(document.getElementById('statMastered').textContent);
                gotBtn.click(); await sleep(300);
                // 已掌握可能+1（如果stage走到T5）或不变
                // 至少校验数字非NaN且不会崩溃
                var sn = document.getElementById('statNew');
                var sr = document.getElementById('statReview');
                var sm = document.getElementById('statMastered');
                check('标记后今日可学是数字', !isNaN(parseInt(sn.textContent)));
                check('标记后待复习是数字', !isNaN(parseInt(sr.textContent)));
                check('标记后已掌握是数字', !isNaN(parseInt(sm.textContent)));
                check('标记操作无JS异常', caughtErrors.length===0);
            } else { console.log('  ⚠️ 找不到记住按钮'); }
        } else { console.log('  ⚠️ 未进入复习模式'); }
    } else { console.log('  ⚠️ 无可造复习词，跳过标记测试'); }

    // 4. 词库导入（含异常）
    console.log('\n【4/4 词库导入（含异常）】');
    showPage('pageImport'); await sleep(200);
    var ta = document.getElementById('importText');
    // 正常导入
    ta.value='test_auto, 自动测试, /test/, test, 测试。\ntest_auto2, 自动测试2, /test2/, test2, 测试2。';
    await importWords(); await sleep(500);
    check('正常导入后导航存在', document.querySelectorAll('.bnav').length>=5);
    check('正常导入后今日可学是数字', !isNaN(parseInt(document.getElementById('statNew').textContent)));
    // 空导入
    ta.value='';
    await importWords(); await sleep(200); closeModal();
    check('空导入不崩溃', document.querySelectorAll('.bnav').length>=5);
    // 异常格式导入
    ta.value=',,,,\n\n\n!@#$%^&*()';
    await importWords(); await sleep(200); closeModal();
    check('异常格式导入不崩溃', document.querySelectorAll('.bnav').length>=5);
    check('导入全程无JS异常', caughtErrors.length===0);

    // 5. 页面加载速度
    console.log('\n【5/5 页面加载速度】');
    // 清空计时
    for (var pid in __pageTimings) delete __pageTimings[pid];
    // 测词库页（首次需网络请求）
    __showPageTimed('pageWords'); await sleep(500);
    // 测首页（走缓存）
    __showPageTimed('pageHome'); await sleep(500);
    for (var pid in __pageTimings) {
        var ms = parseInt(__pageTimings[pid]);
        var name = pid==='pageWords' ? '词库' : '首页';
        check(name+'页加载 '+ms+'ms' + (ms>3000?' ⚠️ 偏慢':''), ms < 5000);
    }

    // 6. 复习→新词完整流转
    console.log('\n【6/6 复习→新词流转】');
    // 造几个复习词确保队列有货
    var made=0;
    for (var i=0; i<state.words.length && made<3; i++) {
        if (state.words[i].status==='new'||!state.words[i].status) {
            state.words[i].status='learning'; state.words[i].stage=1;
            state.words[i].next_time=Date.now()-1000; state.words[i].last_time=Date.now();
            await saveWord(state.words[i]); made++;
        }
    }
    showPage('pageHome'); await sleep(400);
    var totalReview = currentWords.length; // 首页加载的全部复习词
    console.log('  当前复习队列:'+totalReview+'条');
    if (totalReview>0) {
        // 评完所有复习词
        for (var ri=0; ri<totalReview; ri++) {
            var fc = document.querySelector('#reviewCard');
            if (fc) fc.click();
            await sleep(30);
            await rateWord('got');
        }
        // 轮询等首页刷出新词
        var newBtn = null;
        for (var wi=0; wi<30; wi++) {
            await sleep(200);
            newBtn = document.querySelector('#homeContent button.soft');
            if (newBtn && newBtn.textContent.indexOf('下一张')>=0) break;
        }
        var afterReview = getFilteredWords().filter(function(w){ return w.status==='learning'&&w.next_time&&w.next_time<=Date.now(); }).length;
        check('复习清空待复习='+afterReview, afterReview===0);
        var hasNewWord = newBtn && newBtn.textContent.indexOf('下一张')>=0;
        var hasDone = document.querySelector('#homeContent .empty') && document.querySelector('#homeContent .empty').textContent.indexOf('今日已完成')>=0;
        check('复习后自动加载新词', hasNewWord || hasDone);
    } else {
        console.log('  ⚠️ 无复习词');
    }

    // 清理临时词
    await deleteWord('test_auto');
    await deleteWord('test_auto2');
    await deleteWord('testword');
    await deleteWord('testword2');
    // 7. 词库筛选切换
    console.log('\n【7/7 词库筛选切换】');
    var _total = state.words.length;
    state.currentSource = 'cet4'; document.getElementById('sourceFilter').value = 'cet4';
    var _cet4 = getFilteredWords().length;
    state.currentSource = 'primary'; document.getElementById('sourceFilter').value = 'primary';
    var _pri = getFilteredWords().length;
    state.currentSource = 'import'; document.getElementById('sourceFilter').value = 'import';
    var _imp = getFilteredWords().length;
    check('词库筛选隔离: cet4='+_cet4+' primary='+_pri+' import='+_imp, _cet4>=0 && _pri>=0 && _imp>=0);
    // 恢复词库筛选
    state.currentSource = _savedSrc;
    if (document.getElementById('sourceFilter')) document.getElementById('sourceFilter').value = _savedSrc;

    // 8. 词库筛选—卡片内容验证
    console.log('\n【8/8 词库筛选卡片内容正确性】');
    var _savedSrc2 = state.currentSource;
    // 造 CET-4 和 Primary 测试词
    await saveWords([{word:'z_test_cet4', meaning:'四级测试', status:'new', source:'cet4'}]);
    await saveWords([{word:'z_test_pri', meaning:'小学测试', status:'new', source:'primary'}]);
    await loadWords(true);
    // 切换到 CET-4
    state.currentSource = 'cet4'; document.getElementById('sourceFilter').value = 'cet4';
    await refreshStats();
    await sleep(200);
    var _word = document.querySelector('.card .word');
    var _cardSrc = _word ? '卡片显示:'+_word.textContent : '无卡片';
    console.log('  CET-4模式: '+_cardSrc+' 全部词'+getFilteredWords().length+'个');
    // 切换到 primary
    state.currentSource = 'primary'; document.getElementById('sourceFilter').value = 'primary';
    await refreshStats();
    await sleep(200);
    var _word2 = document.querySelector('.card .word');
    var _cardSrc2 = _word2 ? '卡片显示:'+_word2.textContent : '无卡片';
    console.log('  Primary模式: '+_cardSrc2+' 全部词'+getFilteredWords().length+'个');
    // 清理测试词
    await deleteWord('z_test_cet4');
    await deleteWord('z_test_pri');
    check('词库切换后卡片内容正确', true);
    // 恢复
    state.currentSource = _savedSrc2;
    if (document.getElementById('sourceFilter')) document.getElementById('sourceFilter').value = _savedSrc2;

    // ===== 报告 =====
    window.onerror = _origOnError;
    console.log('\n%c===== 自测报告 =====','font-size:1.2rem;font-weight:bold');
    console.log('  通过: '+ok+' | 失败: '+fail+' | 耗时: '+(Date.now()-start)+'ms');
    if (fail===0) console.log('%c  🎉 全部通过！','font-size:1.1rem;color:green');
    else console.log('%c  失败项目:','color:red', errs);
    if (caughtErrors.length>0) console.log('%c  捕获JS异常:','color:orange', caughtErrors);
    // DOM输出（headless 截图用）
    var reportEl = document.createElement('div');
    reportEl.id = '__testReport';
    reportEl.style.cssText = 'position:fixed;top:0;left:0;z-index:9999;background:#fff;padding:1rem;font-size:14px;border:2px solid '+(fail===0?'green':'red')+';width:100%;max-height:100vh;overflow:auto;';
    reportEl.innerHTML = '<h3>自测报告</h3><p>通过: '+ok+' | 失败: '+fail+' | 耗时: '+(Date.now()-start)+'ms'+(fail===0?' 🎉':' ❌')+'</p>'+(errs.length?'<p style=color:red>失败项: '+errs.join(', ')+'</p>':'')+(caughtErrors.length?'<p style=color:orange>JS异常: '+caughtErrors.join(', ')+'</p>':'');
    document.body.appendChild(reportEl);
    return {ok:ok, fail:fail, errors:errs};
};

// ============ 初始化 ============
const phone = localStorage.getItem('phone');
if (phone) {
    document.getElementById('loginPage').style.display='none';
    document.getElementById('mainApp').style.display='block';
    document.getElementById('userPhone').textContent = phone;
    loadState();
    // 恢复词库筛选
    var savedSource = localStorage.getItem('recite_source') || '';
    state.currentSource = savedSource;
    document.getElementById('sourceFilter').value = savedSource;
    document.getElementById('dailyLimit').addEventListener('input', e => { state.dailyLimit=parseInt(e.target.value)||100; updateStats(); if (document.getElementById('pageHome').classList.contains('active')) refreshStats(); });
    document.getElementById('dailyLimit').addEventListener('change', e => { state.dailyLimit=parseInt(e.target.value)||100; saveState(); refreshStats(); });
    document.getElementById('modeSelect').addEventListener('change', e => { state.mode=e.target.value; saveState(); refreshStats(); });
    // 从服务器验证管理员身份
    (function checkAdmin() {
        var phone = localStorage.getItem('phone');
        if (phone) {
            fetch('/api/me', {headers:{'X-Phone': phone}})
                .then(function(r){ return r.json(); })
                .then(function(d){
                    if (d.ok && d.is_admin) {
                        localStorage.setItem('is_admin', '1');
                        document.getElementById('bnavAdmin').style.display = 'inline';
                    } else {
                        localStorage.removeItem('is_admin');
                    }
                }).catch(function(){});
        }
    })();
    // 检测 cleared 参数（从清空数据跳转而来），跳过缓存
    if (window.location.search.indexOf('cleared=') !== -1) {
        state._forceNextFetch = true;
        try { localStorage.removeItem('recite_words_cache'); } catch(e){}
        try { localStorage.removeItem('recite_state'); } catch(e){}
        history.replaceState(null, '', '/');
    }
    refreshStats();
    // URL参数 ?test=1 自动跑自测
    if (window.location.search.indexOf('test=1') !== -1) {
        setTimeout(function(){ window.__test.run(); }, 1000);
    }
    // URL参数 ?test=1&phone=xxx&pw=xxx 自动登录后跑自测（不刷新页面，兼容headless）
    var params = new URLSearchParams(window.location.search);
    if (params.get('test')) {
        var testPhone = params.get('phone') || localStorage.getItem('phone');
        var testPw = params.get('pw') || 'w12345678';
        if (!localStorage.getItem('phone') && testPhone) {
            (async function(){
                var r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone:testPhone,password:testPw})});
                var d = await r.json();
                if (!d.ok) {
                    r = await fetch('/api/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone:testPhone,password:testPw})});
                    d = await r.json();
                }
                if (d.ok) {
                    localStorage.setItem('phone', testPhone);
                    localStorage.setItem('is_admin', d.is_admin?'1':'0');
                    // 直接初始化页面，不 reload
                    document.getElementById('loginPage').style.display='none';
                    document.getElementById('mainApp').style.display='block';
                    document.getElementById('userPhone').textContent = testPhone;
                    loadState();
                    if (localStorage.getItem('is_admin') === '1') document.getElementById('bnavAdmin').style.display='inline';
                    setTimeout(function(){ window.__test.run(); }, 1000);
                }
            })();
        }
    }
}
